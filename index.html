<style>
/* Hallmark · shape: Index · genre: atmospheric · theme: brand · redesign: full
 * paper: oklch(13% 0.010 286) · accent: oklch(93.6% 0.212 122) · display: Unbounded · body: Golos Text · hero: Index · nav: edge-aligned · footer: mast · signature: the catalogue at its real aspects, wide clips spanning two columns instead of being cropped
 * axes: dark/display-heavy/chromatic-lime · posture: Restrained · contrast: pass · fold: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S5 R5 V4 · weakest: P, a catalogue argues little; the argument taken is that a clip's real shape matters more than a tidy grid, so the wide clips span two columns and nothing is cropped */
/* Hallmark · waive 77 · four sections (resume rail, Index hero, the page's own facts, footer mast), each with mass: the catalogue is 300px+ of video per card and the facts row carries three rows across ten columns · a redesign adds no content, and six sections would mean inventing claims this shop cannot make */
/* Hallmark · waive 39b · controls are 52px primary and 44px secondary, but the catalogue cards render 280 to 570px tall · a card here is a video at its own aspect, not a control, and cropping it to control height would hide the product */
/* Hallmark · answered F15 · the three order screens centre their column because each is one object the client is waiting on; the home page is left-aligned throughout */
/* Hallmark · waive 44c · 44b passes: headline, sentence and the first catalogue row all sit above the 1280x800 fold · an Index hero puts the clips themselves on the first screen, so the head stops at 366px and the catalogue fills the rest of it */
/* Hallmark · waive 79 · the 534px under the head is the first row of clips, thumbs measured 373px tall at 1440 · the catalogue begins exactly where the head ends, so there is no band to centre into */
/* Hallmark · waive 83 · every picture is a frame of a clip this shop sells and the browser came to look through them · trimming the catalogue to a third of the page would hide half the stock */
/* Hallmark · dismissed F7 · the pill selectors are the language control, its track, the resume action and the duration badge · F7 leaves the pill to controls, tags and badges */
/* Hallmark · tokens and base live in this block, not in tokens.css and base.css · go:embed ships exactly one file and static.go serves it as a blob, so a second stylesheet would need a new route for no gain */

:root {
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px; --space-4xl: 144px;
  --text-xs: 0.8125rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.25rem; --text-xl: 1.5625rem;
  --text-display: clamp(2.25rem, 5vw + 0.5rem, 4.25rem); --text-section: clamp(1.75rem, 2.2vw + 1rem, 2.75rem);
  --text-title: clamp(1.125rem, 0.6vw + 0.95rem, 1.5rem); --text-lead: clamp(1.0625rem, 0.35vw + 1rem, 1.25rem);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.7, 0, 0.84, 0); --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;

  /* Бренд: лайм и кремовый перенесены как есть, нейтрали подкрашены в холодный тон бренда (hue 286). */
  --color-paper: oklch(13% 0.010 286); --color-paper-2: oklch(18% 0.011 286); --color-paper-3: oklch(24% 0.012 286);
  --color-ink: oklch(96% 0.007 89); --color-ink-2: oklch(76% 0.009 89); --color-muted: oklch(64% 0.010 89);
  --color-rule: oklch(30% 0.012 286);
  --color-accent: oklch(93.6% 0.212 122); --color-accent-ink: oklch(22% 0.050 122); --color-focus: oklch(90% 0.200 122);
  --color-warn-field: oklch(27% 0.065 32); --color-warn-ink: oklch(85% 0.100 48);
  --color-note-field: oklch(26% 0.055 122);
  --color-kaspi: oklch(59% 0.221 26); /* чужой бренд, значение не трогаем */
  --color-scrim: oklch(8% 0.010 286 / 0.62); --color-veil: oklch(8% 0.010 286 / 0.78);

  --font-display: "Unbounded", "Golos Text", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Golos Text", ui-sans-serif, system-ui, sans-serif;

  --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px; --radius-pill: 999px; --rule-hair: 1px;
  --tracking-display: -0.03em;
  --container: 1440px; --gutter: 64px; --section-gap: 96px;
  --nav-h: 64px; --control-h: 52px; --control-h-sm: 44px;
  --z-sticky: 200; --z-sticky-nav: 300; --z-modal: 400;
}
@media (max-width: 60rem) { :root { --gutter: 24px; --section-gap: 72px; } }
@media (max-width: 40rem) { :root { --gutter: 16px; --section-gap: 56px; --nav-h: 56px; } }

/* ——— база ——— */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { color-scheme: dark; scrollbar-color: var(--color-paper-3) var(--color-paper); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; caret-color: var(--color-accent); }
::selection { background: color-mix(in oklab, var(--color-accent) 26%, transparent); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 700; font-synthesis: none; letter-spacing: var(--tracking-display); line-height: 1.06; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
h1 { font-family: var(--font-display); font-size: var(--text-display); max-width: 15ch; }
h2 { font-family: var(--font-display); font-size: var(--text-section); max-width: 24ch; }
h3 { font-size: var(--text-title); line-height: 1.2; max-width: 40ch; }
p { margin: 0; text-wrap: pretty; }
img, video { display: block; max-width: 100%; }
svg { display: block; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes check { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
@keyframes track { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ——— каркас и шапка ——— */
.shell { min-height: 100svh; display: flex; flex-direction: column; }
.main { flex: 1; width: 100%; }
.topbar { position: sticky; top: 0; z-index: var(--z-sticky-nav); background: color-mix(in oklab, var(--color-paper) 84%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: var(--rule-hair) solid var(--color-rule); padding-top: env(safe-area-inset-top); }
.topbar__in { height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
.brand { display: flex; align-items: baseline; gap: var(--space-3xs); font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg); letter-spacing: -.02em; cursor: pointer; white-space: nowrap; }
.brand__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); }
.brand__kz { font-family: var(--font-body); font-weight: 600; color: var(--color-muted); }
.langs { display: flex; gap: var(--space-3xs); padding: var(--space-3xs); border-radius: var(--radius-pill); background: var(--color-paper-2); }
.lang { min-height: var(--control-h-sm); padding-inline: var(--space-md); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 600; color: var(--color-ink-2); cursor: pointer; transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
.lang:hover { color: var(--color-ink); }
.lang[aria-pressed="true"] { background: var(--color-ink); color: var(--color-paper); }

/* ——— кнопки: один рецепт основной, один вторичной ——— */
.btn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: var(--control-h); padding-inline: var(--space-lg); border-radius: var(--radius-md); font-size: var(--text-md); font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn--primary { background: var(--color-accent); color: var(--color-accent-ink); }
.btn--primary:hover:not(:disabled) { background: color-mix(in oklab, var(--color-accent) 86%, var(--color-ink)); }
.btn--primary:focus-visible { outline-color: var(--color-ink); }
.btn--ghost { background: var(--color-paper-2); color: var(--color-ink); }
.btn--ghost:hover:not(:disabled) { background: var(--color-paper-3); }
.btn--sm { min-height: var(--control-h-sm); padding-inline: var(--space-md); font-size: var(--text-sm); }
.btn--wide { width: 100%; }
.btn__label { position: relative; }
.btn__price { position: relative; opacity: .72; }
.btn__prog { position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--pct, 0)); background: color-mix(in oklab, var(--color-accent-ink) 20%, transparent); transition: transform var(--dur-micro) linear; }

/* ——— лента незакрытых заказов ——— */
.resume { display: flex; gap: var(--space-sm); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-block: var(--space-md); padding-inline: var(--gutter); }
.resume::-webkit-scrollbar { display: none; }
.resume__item { flex: 0 0 min(20rem, 86%); scroll-snap-align: start; display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-xs); border-radius: var(--radius-md); background: var(--color-paper-2); color: var(--color-ink); cursor: pointer; text-align: left; animation: fadeUp var(--dur-long) var(--ease-out) both; transition: background-color var(--dur-micro) var(--ease-out); }
.resume__item:hover { background: var(--color-paper-3); }
.resume__thumb { width: 40px; height: 56px; flex: none; border-radius: var(--radius-sm); object-fit: cover; background: var(--color-paper-3); }
.resume__body { flex: 1; min-width: 0; display: block; }
.resume__ttl { display: block; font-size: var(--text-sm); font-weight: 600; }
.resume__sub { display: block; font-size: var(--text-xs); color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resume__go { flex: none; min-height: var(--control-h-sm); display: flex; align-items: center; padding-inline: var(--space-md); border-radius: var(--radius-pill); background: var(--color-accent); color: var(--color-accent-ink); font-size: var(--text-sm); font-weight: 600; }

/* ——— Index: заголовок, затем каталог ——— */
.masthead { padding-block: var(--space-xl) var(--space-lg); }
.sec--grid { padding-bottom: 0; }
.masthead__lead { margin-top: var(--space-md); font-size: var(--text-lead); color: var(--color-ink-2); max-width: 42ch; }
.trust { margin-top: var(--space-lg); display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-lg); font-size: var(--text-sm); color: var(--color-muted); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-md); grid-auto-flow: row dense; align-items: start; }
@media (min-width: 37.5rem) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-lg); } }
@media (min-width: 68.75rem) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { display: block; width: 100%; text-align: left; cursor: pointer; border-radius: var(--radius-lg); animation: fadeUp var(--dur-long) var(--ease-out) both; }
.card:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 3px; }
.card--wide { grid-column: span 2; }
.thumb { position: relative; aspect-ratio: var(--ar, 0.5625); border-radius: var(--radius-lg); overflow: hidden; background: var(--color-paper-2); }
.thumb__img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb video { opacity: 0; transition: opacity var(--dur-short) var(--ease-out); }
.badge { position: absolute; top: var(--space-sm); left: var(--space-sm); padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-pill); background: var(--color-accent); color: var(--color-accent-ink); font-size: var(--text-xs); font-weight: 600; }
.dur { position: absolute; bottom: var(--space-sm); left: var(--space-sm); padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-pill); background: var(--color-scrim); color: var(--color-ink); font-size: var(--text-xs); }
.card__name { margin-top: var(--space-sm); font-size: var(--text-md); font-weight: 600; }
.card__price { margin-top: var(--space-3xs); font-size: var(--text-sm); color: var(--color-ink-2); }
.skel { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-sm); }
.skel__thumb { aspect-ratio: 0.5625; border-radius: var(--radius-lg); background: var(--color-paper-2); animation: pulse 1.4s var(--ease-in-out) infinite; }
.skel__line { height: 12px; border-radius: var(--radius-sm); background: var(--color-paper-2); }
/* Телефон показывает ролик как есть; от трёх колонок высоты карточек сводятся в один диапазон,
   иначе сетка из 9:16 и 16:9 стоит в дырах. Настоящая пропорция видна на карточке шаблона. */
@media (min-width: 37.5rem) {
  .thumb { aspect-ratio: clamp(0.8, var(--ar, 0.5625), 1.6); }
  /* Широкая карточка вдвое шире узкой, поэтому её диапазон вдвое больше: так строки встают вровень. */
  .card--wide .thumb { aspect-ratio: clamp(1.55, var(--ar, 1.78), 1.75); }
  .skel__thumb { aspect-ratio: 0.8; }
}
.empty { margin-top: var(--space-xl); color: var(--color-ink-2); }
.reload { margin-top: var(--space-xl); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-md); color: var(--color-ink-2); }

/* ——— строки с фактами и подвал ——— */
.facts { border-top: var(--rule-hair) solid var(--color-rule); }
.fact { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2xs); padding-block: var(--space-lg); border-bottom: var(--rule-hair) solid var(--color-rule); }
@media (min-width: 48rem) { .fact { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--space-xl); align-items: baseline; } }
.fact__t { font-size: var(--text-title); font-weight: 600; }
.fact__d { color: var(--color-ink-2); }
.foot { margin-top: var(--section-gap); padding-block: var(--space-xl) var(--space-2xl); }
.foot__mark { font-family: var(--font-display); font-weight: 700; font-size: var(--text-section); letter-spacing: var(--tracking-display); }
.foot__links { margin-top: var(--space-lg); display: flex; flex-wrap: wrap; gap: var(--space-sm) var(--space-xl); font-size: var(--text-sm); color: var(--color-ink-2); }

/* ——— карточка шаблона ——— */
.detail { padding-block: var(--space-md) 0; animation: fade var(--dur-short) var(--ease-out) both; }
.back { display: flex; align-items: center; gap: var(--space-2xs); min-height: var(--control-h-sm); margin-bottom: var(--space-sm); padding-right: var(--space-sm); border-radius: var(--radius-sm); font-size: var(--text-sm); font-weight: 500; color: var(--color-ink-2); cursor: pointer; }
.back:hover { color: var(--color-ink); }
.detail__grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); }
@media (min-width: 56.25rem) { .detail__grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--space-2xl); align-items: start; } .detail__media { position: sticky; top: calc(var(--nav-h) + var(--space-md)); } }
.player { width: 100%; aspect-ratio: var(--ar, 0.5625); object-fit: cover; border-radius: var(--radius-lg); background: var(--color-paper-2); }
.detail__panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-lg); align-content: start; min-width: 0; }
.ttl { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-md); }
.ttl h1 { font-size: var(--text-section); max-width: 18ch; }
.price { font-size: var(--text-title); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.desc { margin-top: var(--space-xs); color: var(--color-ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-md); }
.chip { padding: var(--space-2xs) var(--space-sm); border-radius: var(--radius-pill); background: var(--color-paper-2); font-size: var(--text-sm); color: var(--color-ink-2); }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-xs); }
.field__label { font-size: var(--text-sm); color: var(--color-muted); }
.segs { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: var(--space-xs); }
.seg { display: grid; gap: var(--space-3xs); align-content: center; min-height: var(--control-h); padding: var(--space-xs); border-radius: var(--radius-md); background: var(--color-paper-2); color: var(--color-ink); cursor: pointer; text-align: center; transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
.seg:hover { background: var(--color-paper-3); }
.seg[aria-pressed="true"] { background: var(--color-ink); color: var(--color-paper); }
.seg__px { font-weight: 600; }
.seg__price { font-size: var(--text-sm); color: var(--color-muted); }
.seg[aria-pressed="true"] .seg__price { color: var(--color-paper-3); }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-sm); }
@media (min-width: 30rem) { .slots { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.slot { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-xs); padding: var(--space-xs); border-radius: var(--radius-md); background: var(--color-paper-2); color: var(--color-ink); cursor: pointer; text-align: left; transition: background-color var(--dur-micro) var(--ease-out); }
.slot:hover { background: var(--color-paper-3); }
.slot--empty { background: none; box-shadow: inset 0 0 0 1px var(--color-rule); }
.slot--empty:hover { background: var(--color-paper-2); }
.slot__pic { position: relative; aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; background: var(--color-paper-3); display: grid; place-items: center; }
.slot__pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot__tick { position: absolute; right: var(--space-2xs); bottom: var(--space-2xs); width: 20px; height: 20px; border-radius: 50%; background: var(--color-accent); display: grid; place-items: center; animation: popIn var(--dur-short) var(--ease-out) both; }
.slot__ttl { display: block; font-size: var(--text-sm); font-weight: 600; overflow-wrap: break-word; }
.slot__sub { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.alert { display: flex; gap: var(--space-sm); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); background: var(--color-warn-field); color: var(--color-warn-ink); font-size: var(--text-sm); animation: fadeUp var(--dur-short) var(--ease-out) both; }
.note { padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); background: var(--color-note-field); font-size: var(--text-sm); }
.dock { position: sticky; bottom: 0; padding-block: var(--space-md); padding-bottom: calc(var(--space-md) + env(safe-area-inset-bottom)); background: var(--color-paper); }
/* Непрозрачная полоса, над ней короткая растушёвка: иначе слоты просвечивают сквозь кнопку. */
.dock::before { content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: var(--space-lg); background: linear-gradient(180deg, transparent, var(--color-paper)); pointer-events: none; }

async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function post(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
// Настоящий прогресс загрузки: fetch его не отдаёт, поэтому XHR.
function postForm(url, form, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('POST', url);
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => {
      let data = {};
      try { data = JSON.parse(x.responseText); } catch (e) {}
      x.status >= 200 && x.status < 300 ? resolve(data) : reject(new Error(data.error || x.statusText));
    };
    x.onerror = () => reject(new Error('сеть недоступна'));
    x.send(form);
  });
}

function playCard(video) {
  if (!video) return;
  if (!video.getAttribute('src')) { video.setAttribute('src', video.dataset.src); video.load(); }
  video.style.opacity = '1';
  video.play().catch(() => {}); // обещание отклоняется, если успели увести курсор
}

function stopCard(video) {
  if (!video) return;
  video.style.opacity = '0';
  video.pause();
  // Снятый src обрывает докачку: иначе файл продолжит литься уже невидимым.
  video.removeAttribute('src');
  video.load();
}

    stopCard(thumb.querySelector('video'));
  }

  // Телефон: наведения нет, поэтому играет карточка, оказавшаяся в центре экрана.
  // Всегда ровно одна — чтобы прокрутка каталога не тянула все ролики разом.
  syncPreviews() {
    this.stopPreviews();
    const st = this.state;
    if (st.isDesk || st.screen !== 'home' || !st.templates.length) return;

    this.ratios = new Map();
    this.io = new IntersectionObserver(entries => {
      for (const e of entries) this.ratios.set(e.target, e.isIntersecting ? e.intersectionRatio : 0);
      let best = null, bestRatio = 0;
      for (const [el, r] of this.ratios) if (r > bestRatio) { best = el; bestRatio = r; }
      for (const [el] of this.ratios) if (el !== best) stopCard(el.querySelector('video'));
      clearTimeout(this.centerT);
      if (best) this.centerT = setTimeout(() => playCard(best.querySelector('video')), PREVIEW_DELAY_MS);
    }, {
      // Пересечением считается только середина экрана: карточка «в фокусе» — та,
      // что пересекла центральную полосу.
      rootMargin: '-45% 0px -45% 0px',
      threshold: [0, 0.25, 0.5, 0.75, 1],
    });
    document.querySelectorAll('.card .thumb').forEach(el => {
      this.ratios.set(el, 0);
      this.io.observe(el);
    });
  }

  stopPreviews() {
    if (this.io) { this.io.disconnect(); this.io = null; }
    clearTimeout(this.centerT); clearTimeout(this.hoverT);
    cardVideos().forEach(stopCard);
  }

  async loadTemplates() {
    try {
      const templates = await get('/api/templates?lang=' + this.state.lang);
      this.setState({ templates, loading:false, loadError:'' });
    } catch (e) {
      this.setState({ loading:false, loadError: e.message });
    }
  }

  async loadOrder(token) {
    try {
      this.showOrder(await get('/api/orders/' + token));
    } catch (e) {
      dropToken(token); // заказ протух или токен чужой
    }
  }

  // Все заказы браузера — для ленты «Мои видео» на главной.
  async loadOrders() {
    const all = await Promise.all(savedTokens().map(t =>
      get('/api/orders/' + t).catch(() => null))); // сеть моргнула — токен не теряем
    this.setState({ orders: all.filter(o => o && LISTED.includes(o.status)) });
  }

  showOrder(order) {
    this.setState({ order, tplId: order.template_id, resolution: order.resolution });
    this.applyOrderScreen(order);
  }

  applyOrderScreen(order) {
    if (order.status === 'done') return this.setState({ screen:'result' });
    if (order.status === 'failed' || order.status === 'refund_requested' || order.status === 'refunded')
      return this.setState({ screen:'fail', refunded: order.status !== 'failed' });
    if (order.status === 'paid' || order.status === 'generating') return this.startWatch(order.token);
    this.setState({ screen:'home' });
  }

  // Пока идёт генерация, статус спрашиваем у сервера. Бегущие подписи шагов —
  // украшение, к настоящему прогрессу они отношения не имеют.
  startWatch(token) {
    this.stopTimers();
    this.setState({ screen:'gen', step:0 });
    window.scrollTo(0, 0);
    this.stepI = setInterval(() => this.setState(s => ({ step:(s.step + 1) % 5 })), 2200);
    this.pollI = setInterval(async () => {
      try {
        const order = await get('/api/orders/' + token);
        this.setState({ order });
        if (order.status === 'done') { this.stopTimers(); this.setState({ screen:'result', playing:true }); }
        if (order.status === 'failed') { this.stopTimers(); this.setState({ screen:'fail' }); }
      } catch (e) {}
    }, 3000);
  }

  tpl() { return this.state.templates.find(t => t.id === this.state.tplId); }

  open(t) {
    this.stopTimers();
    const res = offered(t);
    this.setState({ screen:'detail', tplId:t.id, resolution: res.includes('720p') ? '720p' : res[0],
      photos:[], uploadError:'', pct:0 });
    window.scrollTo(0, 0);
  }

  pick(i) { this.slot = i; const el = this.fileRef.current; if (el) { el.value = ''; el.click(); } }

  onFile(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (!/^image\//.test(f.type) && !/\.(heic|heif)$/i.test(f.name))
      return this.setState({ uploadError: T[this.state.lang].uploadErr });
    const photos = this.state.photos.slice();
    photos[this.slot ?? 0] = { file:f, url: URL.createObjectURL(f) };
    this.setState({ photos, uploadError:'' });
  }

  // Заказ создаётся вместе с фото одним запросом — до этого момента на сервере
  // ничего нет, и передумавший клиент не оставляет мусора.
  async submit() {
    const s = this.state, t = this.tpl();
    this.lastFocus = document.activeElement; // кнопку сейчас заблокируют, фокус с неё слетит
    const form = new FormData();
    form.append('template_id', t.id);
    form.append('resolution', s.resolution);
    form.append('lang', s.lang);
    s.photos.forEach(p => form.append('photos', p.file, p.file.name));

    this.setState({ busy:true, pct:0, uploadError:'' });
    try {
      const order = await postForm('/api/orders', form, pct => this.setState({ pct }));
      saveToken(order.token);
      this.setState({ order, busy:false, pct:0, sheet:'open' });
    } catch (e) {
      this.setState({ busy:false, pct:0, uploadError: e.message });
    }
  }

  async pay() {
    const s = this.state;
    if (s.sheet === 'busy' || s.sheet === 'wait' || !s.order) return;
    // Вкладку открываем синхронно в клике: открытую после await браузер примет за попап.
    const w = window.open('', '_blank');
    if (w) w.opener = null;
    this.setState({ sheet:'busy' });
    try {
      const res = await post(`/api/orders/${s.order.token}/pay`, { email: s.email });
      // Kaspi: на телефоне это deeplink в приложение, на десктопе — страница оплаты.
      if (!w) { location.href = res.pay_url; return; } // попап заблокирован — уходим сами
      w.location.href = res.pay_url;
      this.waitPay(s.order.token, res.pay_url);
    } catch (e) {
      if (w) w.close();
      this.setState({ sheet:'failed' });
    }
  }

  // Эта вкладка остаётся на сайте и сама замечает оплату (её подтверждает вебхук).
  waitPay(token, payUrl) {
    this.stopTimers();
    this.setState({ sheet:'wait', payUrl });
    this.pollI = setInterval(async () => {
      try {
        const order = await get('/api/orders/' + token);
        if (order.status === 'awaiting_payment') return;
        this.stopTimers();
        this.setState({ order, sheet: order.status === 'expired' ? 'failed' : null });
        if (order.status !== 'expired') this.applyOrderScreen(order);
      } catch (e) {}
    }, 3000);
  }

  async retry() {
    const s = this.state, t = this.tpl();
    if (!s.photos.length || !t) return this.setState({ screen:'detail', photos:[] });
    const form = new FormData();
    s.photos.forEach(p => form.append('photos', p.file, p.file.name));
    this.setState({ busy:true, pct:0 });
    try {
      await postForm(`/api/orders/${s.order.token}/retry`, form, pct => this.setState({ pct }));
      this.setState({ busy:false, pct:0 });
      this.startWatch(s.order.token);
    } catch (e) {
      this.setState({ busy:false, pct:0, uploadError: e.message });
    }
  }

  async refund() {
    try {
      const order = await post(`/api/orders/${this.state.order.token}/refund`);
      this.setState({ order, refunded:true });
    } catch (e) {}
  }

  vals() {
    const s = this.state, L = T[s.lang], cur = this.tpl(), o = s.order;
    const price = cur ? priceOf(cur, s.resolution) : null;

    const slots = cur ? Array.from({ length: cur.ref_photos }, (_, i) => {
      const p = s.photos[i];
      return { i, has:!!p, url: p ? p.url : '',
        title: (cur.slot_labels && cur.slot_labels[i]) || L.slotHint,
        sub: p ? L.added : L.slotHint,
        pick:() => this.pick(i) };
    }) : [];

    const firstEmpty = slots.findIndex(x => !x.has);
    const ready = slots.length > 0 && firstEmpty === -1;

    let ctaLabel = L.ctaUpload, ctaPrice = '';
    if (s.busy) ctaLabel = `${L.sending} ${Math.round(s.pct * 100)}%`;
    else if (ready) { ctaLabel = L.ctaCreate; ctaPrice = price != null ? fmt(price) : ''; }
    else if (firstEmpty > 0) ctaLabel = L.ctaUploadMore;

    const onCta = () => {
      if (s.busy) return;
      if (ready) return this.submit();
      if (firstEmpty >= 0) this.pick(firstEmpty);
    };

    const orderUrl = o ? location.host + '/o/' + o.token : '';

    return {
      t:L, cur, slots, o, facts:L.facts,
      helpHref: 'https://wa.me/77064484218' + (savedTokens().length ? '?text=' + encodeURIComponent('ID: ' + savedTokens().map(t => t.slice(0, 8)).join(', ')) : ''),
      lang:s.lang, setLang: lang => this.setState({ lang }, () => this.loadTemplates()),
      goHome:() => { this.stopTimers(); this.setState({ screen:'home', sheet:null, photos:[] }); this.loadOrders(); window.scrollTo(0,0); },
      isHome:s.screen === 'home', isDetail:s.screen === 'detail', isGen:s.screen === 'gen',
      isResult:s.screen === 'result', isFail:s.screen === 'fail',
      loading:s.loading, loadError:s.loadError, templates:s.templates,
      reload:() => { this.setState({ loading:true, loadError:'' }); this.loadTemplates(); },

      myOrders: s.orders.map(x => ({ token:x.token,
        title: x.status === 'done' ? L.resumeDone
          : (x.status === 'refund_requested' || x.status === 'refunded') ? L.resumeRefund : x.status === 'failed' ? L.resumeFail : L.resumeGen,
        tpl: s.templates.find(t => t.id === x.template_id),
        open:() => this.showOrder(x) })),

      resolutions: cur ? offered(cur).map(r => ({
        id:r, label:r, price: fmt(priceOf(cur, r)), on: r === s.resolution,
        pick:() => this.setState({ resolution:r }),
      })) : [],

      uploadError:s.uploadError, busy:s.busy, pctNum:s.pct,
      ctaLabel, ctaPrice, onCta,
      priceStr: price != null ? fmt(price) : '',
      canRetryFree: !!o && o.can_retry && s.screen === 'detail',

      sheetOpen:!!s.sheet, closeSheet:() => this.closeSheet(),
      stop: e => e.stopPropagation(),
      email:s.email, onEmail: e => this.setState({ email:e.target.value }),
      payFailed:s.sheet === 'failed', payBusy:s.sheet === 'busy', payWait:s.sheet === 'wait', payUrl:s.payUrl, pay:() => this.pay(),
      payLabel: s.sheet === 'busy' ? L.opening : `${L.pay} ${fmt(price || 0)}`,

      firstPhoto: s.photos[0] ? s.photos[0].url : '',
      stepText: L.steps[s.step], orderUrl,
      copyLabel: s.copied ? L.copied : L.copy,
      copyLink:() => { try { navigator.clipboard.writeText(location.origin + '/o/' + o.token); } catch (e) {}
        this.setState({ copied:true }); setTimeout(() => this.setState({ copied:false }), 1800); },

      playState: s.playing ? 'running' : 'paused', paused:!s.playing,
      togglePlay:() => this.setState({ playing:!s.playing }),
      videoHref: o ? `/api/orders/${o.token}/video` : '#',
      shareLabel: s.shared ? L.copied : L.share,
      share:() => { const url = location.origin + '/o/' + o.token;
        if (navigator.share) navigator.share({ url }).catch(() => {});
        else { try { navigator.clipboard.writeText(url); } catch (e) {}
          this.setState({ shared:true }); setTimeout(() => this.setState({ shared:false }), 1800); } },

      again:() => { this.setState({ screen:'home', photos:[], order:null }); this.loadOrders(); window.scrollTo(0,0); },
      startRetry:() => { this.setState({ screen:'detail', photos:[], uploadError:'' }); window.scrollTo(0,0); },
      doRetry:() => this.retry(),
      notRefunded: !s.refunded, refunded:s.refunded, refund:() => this.refund(),
      refundNote: s.order && s.order.status === 'refunded' ? L.refundDone : L.refundNote,
    };
  }

  card(v, item, i) {
    const wide = item.aspect_w > item.aspect_h;
    const low = offered(item);
    return html`
      <button key=${item.id} onClick=${() => this.open(item)} class=${'card' + (wide ? ' card--wide' : '')}
        style=${`--ar:${(item.aspect_w / item.aspect_h).toFixed(4)}; animation-delay:${Math.min(i, 7) * 40}ms`}>
        <div class="thumb" onMouseEnter=${e => this.hoverIn(e.currentTarget)} onMouseLeave=${e => this.hoverOut(e.currentTarget)}>
          ${item.poster_url && html`<img class="thumb__img" src=${item.poster_url} alt=""
            loading=${i < 4 ? 'eager' : 'lazy'} fetchpriority=${i === 0 ? 'high' : 'auto'} decoding="async" />`}
          <video data-src=${item.clip_url} poster=${item.poster_url} muted loop playsinline preload="none"
            onTimeUpdate=${e => { if (e.currentTarget.currentTime > PREVIEW_LOOP_SEC) e.currentTarget.currentTime = 0; }}></video>
          ${item.popular && html`<span class="badge">${v.t.popular}</span>`}
          <span class="dur num">${Math.round(item.duration_sec)} ${v.t.sec}</span>
        </div>
        <div class="card__name">${item.name}</div>
        <div class="card__price num">${low.length ? fmt(Math.min(...low.map(r => priceOf(item, r)))) : ''}</div>
      </button>`;
  }

  home(v) {
    return html`<div>
      ${v.myOrders.length > 0 && html`
        <div class="resume">
          ${v.myOrders.map(m => html`
            <button key=${m.token} onClick=${m.open} class="resume__item">
              ${m.tpl && m.tpl.poster_url && html`<img class="resume__thumb" src=${m.tpl.poster_url} alt="" loading="lazy" />`}
              <span class="resume__body">
                <span class="resume__ttl">${m.title}</span>
                <span class="resume__sub">${m.tpl ? m.tpl.name : ''}</span>
              </span>
              <span class="resume__go">${v.t.open}</span>
            </button>`)}
        </div>`}

      <section class="sec sec--head">
        <div class="container masthead">
          <h1>${v.t.h1}</h1>
          <p class="masthead__lead">${v.t.sub}</p>
          <div class="trust"><span>${v.t.trust}</span><span>${v.t.kaspi}</span></div>
        </div>
      </section>

      <section class="sec sec--grid">
        <div class="container">

        ${v.loadError
          ? html`<div class="reload">
              <span>${v.t.loadErr}</span>
              <button onClick=${v.reload} class="btn btn--ghost btn--sm">${v.t.retryLoad}</button>
            </div>`
          : html`<div class="grid">
            ${v.loading
              ? [1,2,3,4,5,6,7,8].map(i => html`<div key=${i} class="skel" aria-hidden="true">
                  <div class="skel__thumb"></div>
                  <div class="skel__line" style="width:70%"></div>
                </div>`)
              : v.templates.map((item, i) => this.card(v, item, i))}
          </div>`}
        ${!v.loading && !v.loadError && !v.templates.length && html`<p class="empty">${v.t.empty}</p>`}

        </div>
      </section>

      <section class="sec sec--facts">
        <div class="container">
          <div class="facts">
            ${v.facts.map(f => html`<div class="fact" key=${f.t}>
              <div class="fact__t">${f.t}</div>
              <p class="fact__d">${f.d}</p>
            </div>`)}
          </div>
        </div>
      </section>
    </div>`;
  }

  detail(v) {
    const { cur } = v;
    if (!cur) return null;
    return html`<div class="container detail">
      <button onClick=${v.goHome} class="back">${ICON.back}${v.t.back}</button>
      <div class="detail__grid">
        <div class="detail__media">
          <video class="player" src=${cur.clip_url} poster=${cur.poster_url} muted loop playsinline autoplay
            style=${`--ar:${(cur.aspect_w / cur.aspect_h).toFixed(4)}`}></video>
        </div>

        <div class="detail__panel">
          <div>
            <div class="ttl">
              <h1>${cur.name}</h1>
              <span class="price num">${v.priceStr}</span>
            </div>
            <p class="desc">${cur.desc}</p>
            <div class="chips">
              ${[`${cur.ref_photos} ${v.t.photos}`, `${Math.round(cur.duration_sec)} ${v.t.sec}`, `${cur.aspect_w}:${cur.aspect_h}`].map(x =>
                html`<span key=${x} class="chip num">${x}</span>`)}
            </div>
          </div>

          ${v.resolutions.length > 1 && html`
            <div class="field">
              <div class="field__label" id="q-label">${v.t.quality}</div>
              <div class="segs" style=${`--n:${v.resolutions.length}`} role="group" aria-labelledby="q-label">
                ${v.resolutions.map(r => html`
                  <button key=${r.id} class="seg" aria-pressed=${r.on} onClick=${r.pick}>
                    <span class="seg__px num">${r.label}</span>
                    <span class="seg__price num">${r.price}</span>
                  </button>`)}
              </div>
            </div>`}

          <div class="field">
            <div class="slots">
              ${v.slots.map(s => html`
                <button key=${s.i} onClick=${s.pick} class=${'slot' + (s.has ? '' : ' slot--empty')}>
                  <span class="slot__pic">
                    ${s.has ? html`<img src=${s.url} alt="" />` : ICON.plus}
                    ${s.has && html`<span class="slot__tick">${ICON.tick}</span>`}
                  </span>
                  <span class="slot__ttl">${s.title}</span>
                  <span class="slot__sub">${s.has ? v.t.replace : s.sub}</span>
                </button>`)}
            </div>
            ${v.uploadError && html`<div class="alert" role="alert">${ICON.warn}<span>${v.uploadError}</span></div>`}
            ${v.canRetryFree && html`<div class="note">${v.t.retryNote}</div>`}
          </div>

          <div class="dock">
            <button onClick=${v.canRetryFree ? v.doRetry : v.onCta} disabled=${v.busy}
              class="btn btn--primary btn--wide" style=${`--pct:${v.pctNum}`}>
              ${v.busy && html`<span class="btn__prog" aria-hidden="true"></span>`}
              <span class="btn__label">${v.canRetryFree ? v.t.ctaRetry : v.ctaLabel}</span>
              ${v.canRetryFree
                ? html`<span class="btn__price">${v.t.free}</span>`
                : v.ctaPrice && html`<span class="btn__price num">${v.ctaPrice}</span>`}
            </button>
            <div class="dock__note">${v.t.trust}</div>
          </div>
        </div>
      </div>
    </div>`;
  }

  gen(v) {
    const cur = v.cur;
    return html`<div class="container stage">
      <div class="genframe" style=${cur ? `--ar:${(cur.aspect_w / cur.aspect_h).toFixed(4)}` : ''}>
        ${cur && cur.poster_url && html`<img class="genframe__img" src=${cur.poster_url} alt="" />`}
        <span class="genframe__veil" aria-hidden="true"></span>
        ${v.firstPhoto && html`<img class="genframe__face" src=${v.firstPhoto} alt="" />`}
      </div>
      <div>
        <h1>${v.t.genTitle}</h1>
        <div class="genstep" role="status">${v.stepText}</div>
      </div>
      <div class="genbar" aria-hidden="true"><span class="genbar__fill"></span></div>
      <div>
        <p class="stage__note">${v.t.genNote}</p>
        <p class="stage__note">${v.t.usually}</p>
      </div>

      <div class="linkbox">
        <span class="linkbox__body">
          <span class="linkbox__label" id="olabel">${v.t.orderLink}</span>
          <span class="linkbox__value">${v.orderUrl}</span>
        </span>
        <button onClick=${v.copyLink} class="btn btn--ghost btn--sm" aria-describedby="olabel">${v.copyLabel}</button>
      </div>
    </div>`;
  }

  result(v) {
    const cur = v.cur;
    return html`<div class="container stage">
      <span class="ready">${ICON.checkAnim}${v.t.ready}</span>
      <video class="result__video" src=${v.videoHref} poster=${cur ? cur.poster_url : ''} controls playsinline autoplay muted loop
        style=${cur ? `--ar:${(cur.aspect_w / cur.aspect_h).toFixed(4)}` : ''}></video>
      <div class="actions">
        <a href=${v.videoHref} download class="btn btn--primary btn--wide">${ICON.download}<span>${v.t.download}</span></a>
        <div class="actions__pair">
          <button onClick=${v.share} class="btn btn--ghost">${ICON.share}${v.shareLabel}</button>
          <button onClick=${v.again} class="btn btn--ghost">${v.t.more}</button>
        </div>
        <div class="keepnote">${v.t.keep}</div>
      </div>
    </div>`;
  }

  fail(v) {
    return html`<div class="container stage">
      <span class="facemark">${ICON.face}</span>
      <div>
        <h1>${v.refunded ? v.t.refundTitle : v.t.failTitle}</h1>
        <p class="stage__note" style="margin-top:var(--space-sm)">${v.refunded ? v.refundNote : v.t.failText}</p>
      </div>
      <div class="actions">
        ${v.notRefunded && v.o && v.o.can_retry && html`<button onClick=${v.startRetry} class="btn btn--primary btn--wide">${v.t.retry}</button>`}
        ${v.notRefunded && v.o && v.o.can_refund && html`<button onClick=${v.refund} class="btn btn--ghost btn--wide">${v.t.refund}</button>`}
        ${v.refunded && html`<button onClick=${v.again} class="btn btn--ghost btn--wide">${v.t.home}</button>`}
      </div>
    </div>`;
  }

  sheet(v) {
    const { cur } = v;
    return html`<div onClick=${v.closeSheet} class="scrim">
      <div onClick=${v.stop} class="sheet" role="dialog" aria-modal="true" aria-labelledby="pay-ttl" tabindex="-1" ref=${this.sheetRef}>
        <span class="sheet__grab" aria-hidden="true"></span>
        <div class="sheet__head">
          <span class="sheet__ttl" id="pay-ttl">${v.t.payTitle}</span>
          <button onClick=${v.closeSheet} class="sheet__close" aria-label=${v.t.close}>${ICON.close}</button>
        </div>

        <div class="sheet__item">
          ${cur && cur.poster_url && html`<img class="sheet__poster" src=${cur.poster_url} alt="" />`}
          <span class="linkbox__body">
            <span class="linkbox__value">${cur ? cur.name : ''}</span>
            <span class="sheet__meta num">
              <span>${cur ? cur.ref_photos : 0} ${v.t.photos}</span>
              <span>${v.o ? v.o.resolution : ''}</span>
            </span>
          </span>
          ${v.firstPhoto && html`<img class="sheet__face" src=${v.firstPhoto} alt="" />`}
        </div>

        <div class="sheet__total">
          <span>
            <span class="field__label">${v.t.total}</span>
            <span class="sheet__hint">${v.t.oneTime}</span>
          </span>
          <span class="sheet__sum num">${v.o ? fmt(v.o.amount_kzt) : v.priceStr}</span>
        </div>

        <label class="field">
          <span class="sheet__hint"><span>${v.t.emailLabel}</span><span>${v.t.optional}</span></span>
          <input class="input" type="email" value=${v.email} onInput=${v.onEmail} placeholder="name@mail.kz" />
        </label>

        ${v.payFailed && html`<div class="alert" role="alert">${ICON.warn}<span>${v.t.payFail}</span></div>`}

        ${v.payWait ? html`
          <div>
            <div class="waitbtn"><span class="spinner spinner--light" aria-hidden="true"></span><span>${v.t.waitPay}</span></div>
            <a href=${v.payUrl} target="_blank" rel="noopener" class="sheet__legal" style="margin-top:var(--space-sm)">${v.t.reopen}</a>
          </div>` : html`
        <button onClick=${v.pay} disabled=${v.payBusy} class="btn btn--primary btn--wide">
          ${v.payBusy ? html`<span class="spinner" aria-hidden="true"></span>` : html`<span class="kaspi" aria-hidden="true"></span>`}
          <span>${v.payLabel}</span>
        </button>`}
        <div class="sheet__legal">${ICON.lock}${v.t.afterPay}</div>
      </div>
    </div>`;
  }

  render() {
    const v = this.vals();
    return html`<div class="shell">
      <input type="file" accept="image/*,.heic,.heif" ref=${this.fileRef} onChange=${e => this.onFile(e)} class="filepick" tabindex="-1" aria-hidden="true" />

      <header class="topbar" inert=${v.sheetOpen}>
        <div class="container topbar__in">
          <button onClick=${v.goHome} class="brand">qaitala<span class="brand__dot" aria-hidden="true"></span><span class="brand__kz">kz</span></button>
          <div class="langs">
            ${[['ru','Рус'],['kz','Қаз']].map(([id, label]) => html`
              <button key=${id} class="lang" aria-pressed=${v.lang === id} onClick=${() => v.setLang(id)}>${label}</button>`)}
          </div>
        </div>
      </header>

      <main class="main" inert=${v.sheetOpen}>
        ${v.isHome && this.home(v)}
        ${v.isDetail && this.detail(v)}
        ${v.isGen && this.gen(v)}
        ${v.isResult && this.result(v)}
        ${v.isFail && this.fail(v)}
      </main>

      ${v.isHome && html`
        <footer class="container foot" inert=${v.sheetOpen}>
          <div class="foot__mark">qaitala<span class="brand__dot" aria-hidden="true"></span>kz</div>
          <div class="foot__links">
            <span>${v.t.trust}</span>
            <a href=${v.helpHref} target="_blank" rel="noopener">${v.t.help}</a>
          </div>
        </footer>`}

      ${v.sheetOpen && this.sheet(v)}
    </div>`;
  }
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
