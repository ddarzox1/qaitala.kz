// Токены заказов этого браузера, новые первыми. Сам заказ живёт по ссылке /o/{token}.
const KEY = 'qait-orders-v1', OLD_KEY = 'qait-order-v1', MAX_SAVED = 10;
function savedTokens() {
  try {
    const list = JSON.parse(localStorage.getItem(KEY) || '[]');
    const old = localStorage.getItem(OLD_KEY);
    return old && !list.includes(old) ? [old, ...list] : list;
  } catch (e) { return []; }
}
function writeTokens(list) {
  try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, MAX_SAVED))); localStorage.removeItem(OLD_KEY); } catch (e) {}
}
const saveToken = t => writeTokens([t, ...savedTokens().filter(x => x !== t)]);
const dropToken = t => writeTokens(savedTokens().filter(x => x !== t));
const LISTED = ['paid', 'generating', 'done', 'failed', 'refund_requested', 'refunded'];

const RES = ['480p', '720p', '1080p'];

    genTitle:'Видеоңды жасап жатырмыз', genNote:'Бетті ашық қалдыруға немесе кейін оралуға болады', usually:'әдетте 2–3 минут', steps:['Фотоны зерттеп жатырмыз','Жарық қойып жатырмыз','Кадрларды жинап жатырмыз','Қозғалыс қосып жатырмыз','Соңғы штрихтар'],

};

// ——— API ———————————————————————————————————————————————————————————————

async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function post(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
// Настоящий прогресс загрузки: fetch его не отдаёт, поэтому XHR.
function postForm(url, form, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('POST', url);
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => {
      let data = {};
      try { data = JSON.parse(x.responseText); } catch (e) {}
      x.status >= 200 && x.status < 300 ? resolve(data) : reject(new Error(data.error || x.statusText));
    };
    x.onerror = () => reject(new Error('сеть недоступна'));
    x.send(form);
  });
}

const ar = t => `${t.aspect_w}/${t.aspect_h}`;
const priceOf = (t, res) => t['price_' + res];
const offered = t => RES.filter(r => priceOf(t, r) != null);
const tokenFromPath = () => (location.pathname.match(/^\/o\/([A-Za-z0-9_-]+)/) || [])[1] || '';

// ——— Живые превью в каталоге ——————————————————————————————————————————

// Крутим только начало ролика: иначе браузер вытянет все 30 секунд файла.
const PREVIEW_LOOP_SEC = 6;
// Карточка должна задержаться под курсором или в центре экрана. Быстрый проход
// мышью и быстрая прокрутка не должны грузить ничего.
const PREVIEW_DELAY_MS = 350;

function playCard(video) {
  if (!video) return;
  if (!video.getAttribute('src')) { video.setAttribute('src', video.dataset.src); video.load(); }
  video.style.opacity = '1';
  video.play().catch(() => {}); // обещание отклоняется, если успели увести курсор
}

function stopCard(video) {
  if (!video) return;
  video.style.opacity = '0';
  video.pause();
  // Снятый src обрывает докачку: иначе файл продолжит литься уже невидимым.
  video.removeAttribute('src');
  video.load();
}

const cardVideos = () => document.querySelectorAll('.card .thumb video');

const ICON = {
  back: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  mute: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>`,
  plus: html`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  tick: html`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`,
  warn: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none; margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>`,
  face: html`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`,
  close: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  creditCard: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/></svg>`,
  lock: html`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>`,
  download: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D2FF3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>`,
  dlDone: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D2FF3A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`,
  share: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg>`,
  play: html`<svg width="24" height="24" viewBox="0 0 24 24" fill="#17171A"><path d="M8 5v14l11-7z"/></svg>`,
  checkAnim: html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7" stroke-dasharray="30" style="animation:check .5s .2s ease both"/></svg>`,
  payDone: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7" stroke-dasharray="30" style="animation:check .4s ease both"/></svg>`,
};
const spinner = (border, top) => html`<span style="width:18px; height:18px; border-radius:50%; border:2.5px solid ${border}; border-top-color:${top}; animation:spin .8s linear infinite"></span>`;


class App extends Component {
  fileRef = createRef();
  state = {
    screen:'home', tplId:'', lang:'ru', resolution:'', photos:[], uploadError:'',
    sheet:null, email:'', step:0, copied:false, playing:true, shared:false, isDesk:false,
    loading:true, loadError:'', templates:[], order:null, orders:[], payUrl:'', pct:0, busy:false, refunded:false,
  };

  componentDidMount() {
    this.onResize = () => this.setState({ isDesk: window.innerWidth >= 760 });
    this.onResize(); window.addEventListener('resize', this.onResize);
    this.loadTemplates();

    const token = tokenFromPath();
    if (token) { saveToken(token); this.loadOrder(token); }
    this.loadOrders();
  }
  componentDidUpdate(_, prev) {
    const st = this.state;
    if (prev.templates !== st.templates || prev.screen !== st.screen || prev.isDesk !== st.isDesk) {
      this.syncPreviews();
    }
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    this.stopTimers(); this.stopPreviews();
  }
  stopTimers() { clearInterval(this.stepI); clearInterval(this.pollI); }

  // Десктоп: превью запускает наведение.
  hoverIn(thumb) {
    if (!this.state.isDesk) return;
    clearTimeout(this.hoverT);
    this.hoverT = setTimeout(() => playCard(thumb.querySelector('video')), PREVIEW_DELAY_MS);
  }
  hoverOut(thumb) {
    if (!this.state.isDesk) return;
    clearTimeout(this.hoverT);
    stopCard(thumb.querySelector('video'));
  }

  // Телефон: наведения нет, поэтому играет карточка, оказавшаяся в центре экрана.
  // Всегда ровно одна — чтобы прокрутка каталога не тянула все ролики разом.
  syncPreviews() {
    this.stopPreviews();
    const st = this.state;
    if (st.isDesk || st.screen !== 'home' || !st.templates.length) return;

    this.ratios = new Map();
    this.io = new IntersectionObserver(entries => {
      for (const e of entries) this.ratios.set(e.target, e.isIntersecting ? e.intersectionRatio : 0);
      let best = null, bestRatio = 0;
      for (const [el, r] of this.ratios) if (r > bestRatio) { best = el; bestRatio = r; }
      for (const [el] of this.ratios) if (el !== best) stopCard(el.querySelector('video'));
      clearTimeout(this.centerT);
      if (best) this.centerT = setTimeout(() => playCard(best.querySelector('video')), PREVIEW_DELAY_MS);
    }, {
      // Пересечением считается только середина экрана: карточка «в фокусе» — та,
      // что пересекла центральную полосу.
      rootMargin: '-45% 0px -45% 0px',
      threshold: [0, 0.25, 0.5, 0.75, 1],
    });
    document.querySelectorAll('.card .thumb').forEach(el => {
      this.ratios.set(el, 0);
      this.io.observe(el);
    });
  }

  stopPreviews() {
    if (this.io) { this.io.disconnect(); this.io = null; }
    clearTimeout(this.centerT); clearTimeout(this.hoverT);
    cardVideos().forEach(stopCard);
  }

  async loadTemplates() {
    try {
      const templates = await get('/api/templates?lang=' + this.state.lang);
      this.setState({ templates, loading:false, loadError:'' });
    } catch (e) {
      this.setState({ loading:false, loadError: e.message });
    }
  }

  async loadOrder(token) {
    try {
      this.showOrder(await get('/api/orders/' + token));
    } catch (e) {
      dropToken(token); // заказ протух или токен чужой
    }
  }

  // Все заказы браузера — для ленты «Мои видео» на главной.
  async loadOrders() {
    const all = await Promise.all(savedTokens().map(t =>
      get('/api/orders/' + t).catch(() => null))); // сеть моргнула — токен не теряем
    this.setState({ orders: all.filter(o => o && LISTED.includes(o.status)) });
  }

  showOrder(order) {
    this.setState({ order, tplId: order.template_id, resolution: order.resolution });
    this.applyOrderScreen(order);
  }

  applyOrderScreen(order) {
    if (order.status === 'done') return this.setState({ screen:'result' });
    if (order.status === 'failed' || order.status === 'refund_requested' || order.status === 'refunded')
      return this.setState({ screen:'fail', refunded: order.status !== 'failed' });
    if (order.status === 'paid' || order.status === 'generating') return this.startWatch(order.token);
    this.setState({ screen:'home' });
  }

  // Пока идёт генерация, статус спрашиваем у сервера. Бегущие подписи шагов —
  // украшение, к настоящему прогрессу они отношения не имеют.
  startWatch(token) {
    this.stopTimers();
    this.setState({ screen:'gen', step:0 });
    window.scrollTo(0, 0);
    this.stepI = setInterval(() => this.setState(s => ({ step:(s.step + 1) % 5 })), 2200);
    this.pollI = setInterval(async () => {
      try {
        const order = await get('/api/orders/' + token);
        this.setState({ order });
        if (order.status === 'done') { this.stopTimers(); this.setState({ screen:'result', playing:true }); }
        if (order.status === 'failed') { this.stopTimers(); this.setState({ screen:'fail' }); }
      } catch (e) {}
    }, 3000);
  }

  tpl() { return this.state.templates.find(t => t.id === this.state.tplId); }

  open(t) {
    this.stopTimers();
    const res = offered(t);
    this.setState({ screen:'detail', tplId:t.id, resolution: res.includes('720p') ? '720p' : res[0],
      photos:[], uploadError:'', pct:0 });
    window.scrollTo(0, 0);
  }

  pick(i) { this.slot = i; const el = this.fileRef.current; if (el) { el.value = ''; el.click(); } }

  onFile(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (!/^image\//.test(f.type) && !/\.(heic|heif)$/i.test(f.name))
      return this.setState({ uploadError: T[this.state.lang].uploadErr });
    const photos = this.state.photos.slice();
    photos[this.slot ?? 0] = { file:f, url: URL.createObjectURL(f) };
    this.setState({ photos, uploadError:'' });
  }

  // Заказ создаётся вместе с фото одним запросом — до этого момента на сервере
  // ничего нет, и передумавший клиент не оставляет мусора.
  async submit() {
    const s = this.state, t = this.tpl();
    const form = new FormData();
    form.append('template_id', t.id);
    form.append('resolution', s.resolution);
    form.append('lang', s.lang);
    s.photos.forEach(p => form.append('photos', p.file, p.file.name));

    this.setState({ busy:true, pct:0, uploadError:'' });
    try {
      const order = await postForm('/api/orders', form, pct => this.setState({ pct }));
      saveToken(order.token);
      this.setState({ order, busy:false, pct:0, sheet:'open' });
    } catch (e) {
      this.setState({ busy:false, pct:0, uploadError: e.message });
    }
  }

  async pay() {
    const s = this.state;
    if (s.sheet === 'busy' || s.sheet === 'wait' || !s.order) return;
    // Вкладку открываем синхронно в клике: открытую после await браузер примет за попап.
    const w = window.open('', '_blank');
    if (w) w.opener = null;
    this.setState({ sheet:'busy' });
    try {
      const res = await post(`/api/orders/${s.order.token}/pay`, { email: s.email });
      // Kaspi: на телефоне это deeplink в приложение, на десктопе — страница оплаты.
      if (!w) { location.href = res.pay_url; return; } // попап заблокирован — уходим сами
      w.location.href = res.pay_url;
      this.waitPay(s.order.token, res.pay_url);
    } catch (e) {
      if (w) w.close();
      this.setState({ sheet:'failed' });
    }
  }

  // Эта вкладка остаётся на сайте и сама замечает оплату (её подтверждает вебхук).
  waitPay(token, payUrl) {
    this.stopTimers();
    this.setState({ sheet:'wait', payUrl });
    this.pollI = setInterval(async () => {
      try {
        const order = await get('/api/orders/' + token);
        if (order.status === 'awaiting_payment') return;
        this.stopTimers();
        this.setState({ order, sheet: order.status === 'expired' ? 'failed' : null });
        if (order.status !== 'expired') this.applyOrderScreen(order);
      } catch (e) {}
    }, 3000);
  }

  async retry() {
    const s = this.state, t = this.tpl();
    if (!s.photos.length || !t) return this.setState({ screen:'detail', photos:[] });
    const form = new FormData();
    s.photos.forEach(p => form.append('photos', p.file, p.file.name));
    this.setState({ busy:true, pct:0 });
    try {
      await postForm(`/api/orders/${s.order.token}/retry`, form, pct => this.setState({ pct }));
      this.setState({ busy:false, pct:0 });
      this.startWatch(s.order.token);
    } catch (e) {
      this.setState({ busy:false, pct:0, uploadError: e.message });
    }
  }

  async refund() {
    try {
      const order = await post(`/api/orders/${this.state.order.token}/refund`);
      this.setState({ order, refunded:true });
    } catch (e) {}
  }

  vals() {
    const s = this.state, L = T[s.lang], cur = this.tpl(), o = s.order;
    const price = cur ? priceOf(cur, s.resolution) : null;

    const slots = cur ? Array.from({ length: cur.ref_photos }, (_, i) => {
      const p = s.photos[i];
      return { i, has:!!p, url: p ? p.url : '',
        title: (cur.slot_labels && cur.slot_labels[i]) || L.slotHint,
        sub: p ? L.added : L.slotHint,
        bg: p ? '#fff' : 'rgba(255,255,255,.5)',
        border: p ? '1px solid rgba(23,23,26,.08)' : '1.5px dashed rgba(23,23,26,.22)',
        pick:() => this.pick(i) };
    }) : [];

    const firstEmpty = slots.findIndex(x => !x.has);
    const ready = slots.length > 0 && firstEmpty === -1;

    let ctaLabel = L.ctaUpload, ctaPrice = '';
    if (s.busy) ctaLabel = `${L.sending} ${Math.round(s.pct * 100)}%`;
    else if (ready) { ctaLabel = L.ctaCreate; ctaPrice = price != null ? fmt(price) : ''; }
    else if (firstEmpty > 0) ctaLabel = L.ctaUploadMore;

    const onCta = () => {
      if (s.busy) return;
      if (ready) return this.submit();
      if (firstEmpty >= 0) this.pick(firstEmpty);
    };

    const orderUrl = o ? location.host + '/o/' + o.token : '';

    return {
      t:L, cur, slots, o,
      lang:s.lang, setLang: lang => this.setState({ lang }, () => this.loadTemplates()),
      goHome:() => { this.stopTimers(); this.setState({ screen:'home', sheet:null, photos:[] }); this.loadOrders(); window.scrollTo(0,0); },
      isHome:s.screen === 'home', isDetail:s.screen === 'detail', isGen:s.screen === 'gen',
      isResult:s.screen === 'result', isFail:s.screen === 'fail',
      loading:s.loading, loadError:s.loadError, templates:s.templates,
      reload:() => { this.setState({ loading:true, loadError:'' }); this.loadTemplates(); },

      myOrders: s.orders.map(x => ({ token:x.token,
        title: x.status === 'done' ? L.resumeDone
          : (x.status === 'refund_requested' || x.status === 'refunded') ? L.resumeRefund : x.status === 'failed' ? L.resumeFail : L.resumeGen,
        tpl: s.templates.find(t => t.id === x.template_id),
        open:() => this.showOrder(x) })),

      resolutions: cur ? offered(cur).map(r => ({
        id:r, label:r, price: fmt(priceOf(cur, r)), on: r === s.resolution,
        pick:() => this.setState({ resolution:r }),
      })) : [],

      uploadError:s.uploadError, busy:s.busy, pct:`${Math.round(s.pct * 100)}%`,
      ctaLabel, ctaPrice, onCta, ctaOpacity: s.busy ? .55 : 1,
      priceStr: price != null ? fmt(price) : '',
      canRetryFree: !!o && o.can_retry && s.screen === 'detail',

      sheetOpen:!!s.sheet, sheetAlign: s.isDesk ? 'center' : 'flex-end', sheetPad: s.isDesk ? '24px' : '0',
      sheetRadius: s.isDesk ? '28px' : '28px 28px 0 0',
      sheetAnim: s.isDesk ? 'popIn .3s ease both' : 'sheetUp .38s cubic-bezier(.2,.9,.3,1) both',
      closeSheet:() => { if (s.sheet === 'busy') return; if (s.sheet === 'wait') this.stopTimers(); this.setState({ sheet:null }); },
      stop: e => e.stopPropagation(),
      email:s.email, onEmail: e => this.setState({ email:e.target.value }),
      payFailed:s.sheet === 'failed', payBusy:s.sheet === 'busy', payWait:s.sheet === 'wait', payUrl:s.payUrl, pay:() => this.pay(),
      payLabel: s.sheet === 'busy' ? L.opening : `${L.pay} ${fmt(price || 0)}`,

      firstPhoto: s.photos[0] ? s.photos[0].url : '',
      stepText: L.steps[s.step], orderUrl,
      copyLabel: s.copied ? L.copied : L.copy,
      copyLink:() => { try { navigator.clipboard.writeText(location.origin + '/o/' + o.token); } catch (e) {}
        this.setState({ copied:true }); setTimeout(() => this.setState({ copied:false }), 1800); },

      playState: s.playing ? 'running' : 'paused', paused:!s.playing,
      togglePlay:() => this.setState({ playing:!s.playing }),
      videoHref: o ? `/api/orders/${o.token}/video` : '#',
      shareLabel: s.shared ? L.copied : L.share,
      share:() => { const url = location.origin + '/o/' + o.token;
        if (navigator.share) navigator.share({ url }).catch(() => {});
        else { try { navigator.clipboard.writeText(url); } catch (e) {}
          this.setState({ shared:true }); setTimeout(() => this.setState({ shared:false }), 1800); } },

      again:() => { this.setState({ screen:'home', photos:[], order:null }); this.loadOrders(); window.scrollTo(0,0); },
      startRetry:() => { this.setState({ screen:'detail', photos:[], uploadError:'' }); window.scrollTo(0,0); },
      doRetry:() => this.retry(),
      notRefunded: !s.refunded, refunded:s.refunded, refund:() => this.refund(),
      refundNote: s.order && s.order.status === 'refunded' ? L.refundDone : L.refundNote,
    };
  }

      <video src=${v.videoHref} poster=${cur ? cur.poster_url : ''} controls playsinline autoplay muted loop
        style="width:100%; max-width:340px; margin-top:16px; aspect-ratio:${cur ? ar(cur) : '9/16'}; object-fit:cover; border-radius:26px; background:#E7E4DC; box-shadow:0 34px 70px -30px rgba(23,23,26,.6); animation:popIn .6s .1s ease both"></video>

      <div style="width:100%; margin-top:22px; display:flex; flex-direction:column; gap:10px">
        <a href=${v.videoHref} download class="press" style="width:100%; height:58px; border-radius:18px; background:#17171A; color:#fff; font-size:17px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; box-shadow:0 14px 28px -14px rgba(23,23,26,.6)">
          ${ICON.download}<span>${v.t.download}</span>
        </a>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
          <button onClick=${v.share} style="height:52px; border-radius:16px; cursor:pointer; background:#fff; border:1px solid rgba(23,23,26,.1); font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px">${ICON.share}${v.shareLabel}</button>
          <button onClick=${v.again} style="height:52px; border-radius:16px; cursor:pointer; background:#fff; border:1px solid rgba(23,23,26,.1); font-size:15px; font-weight:600">${v.t.more}</button>
        </div>
        <div style="margin-top:6px; text-align:center; font-size:13px; color:#6B6A66">${v.t.keep}</div>
      </div>
    </div>`;
  }

  fail(v) {
    return html`<div style="max-width:420px; margin:0 auto; padding:36px 16px 48px; display:flex; flex-direction:column; align-items:center; text-align:center; animation:fade .4s ease both">
      <div style="width:56px; height:56px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px -12px rgba(23,23,26,.4)">${ICON.face}</div>
      <h1 style="margin:22px 0 0; font-weight:800; font-size:23px; letter-spacing:-.03em; text-wrap:balance">${v.refunded ? v.t.refundTitle : v.t.failTitle}</h1>
      <p style="margin:10px 0 0; font-size:15px; line-height:1.5; color:#5F5E59; text-wrap:pretty">${v.refunded ? v.refundNote : v.t.failText}</p>
      <div style="width:100%; margin-top:24px; display:flex; flex-direction:column; gap:10px">
        ${v.notRefunded && v.o && v.o.can_retry && html`<button onClick=${v.startRetry} class="press" style="width:100%; height:58px; border:0; border-radius:18px; cursor:pointer; background:#17171A; color:#fff; font-size:17px; font-weight:600">${v.t.retry}</button>`}
        ${v.notRefunded && v.o && v.o.can_refund && html`<button onClick=${v.refund} style="width:100%; height:52px; border-radius:16px; cursor:pointer; background:transparent; border:1px solid rgba(23,23,26,.12); font-size:15px; font-weight:600">${v.t.refund}</button>`}
        ${v.refunded && html`<button onClick=${v.again} style="width:100%; height:52px; border-radius:16px; cursor:pointer; background:#fff; border:1px solid rgba(23,23,26,.1); font-size:15px; font-weight:600">${v.t.home}</button>`}
      </div>
    </div>`;
  }

  sheet(v) {
    const { cur } = v;
    return html`<div onClick=${v.closeSheet} style="position:fixed; inset:0; z-index:50; background:rgba(23,23,26,.42); backdrop-filter:blur(3px); display:flex; justify-content:center; align-items:${v.sheetAlign}; padding:${v.sheetPad}; animation:fade .2s ease both">
      <div onClick=${v.stop} style="width:100%; max-width:440px; background:#FBFAF7; border-radius:${v.sheetRadius}; padding:10px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(23,23,26,.2); animation:${v.sheetAnim}">
        <div style="width:40px; height:5px; border-radius:5px; background:#DAD7CF; margin:0 auto 12px"></div>
        <div style="display:flex; align-items:center; justify-content:space-between">
          <span style="font-size:18px; font-weight:700">${v.t.payTitle}</span>
          <button onClick=${v.closeSheet} aria-label="Закрыть" style="width:36px; height:36px; border-radius:50%; border:0; background:#ECE9E2; cursor:pointer; display:flex; align-items:center; justify-content:center">${ICON.close}</button>
        </div>

        <div style="margin-top:14px; display:flex; align-items:center; gap:14px; padding:12px; border-radius:18px; background:#fff; border:1px solid rgba(23,23,26,.07)">
          <div style="width:44px; height:60px; border-radius:10px; flex:none; background:#E7E4DC center/cover url(${cur ? cur.poster_url : ''})"></div>
          <div style="flex:1; min-width:0">
            <div style="font-size:16px; font-weight:600">${cur ? cur.name : ''}</div>
            <div style="font-size:13px; color:#6B6A66; margin-top:3px">${cur ? cur.ref_photos : 0} фото · ${v.o ? v.o.resolution : ''}</div>
          </div>
          ${v.firstPhoto && html`<div style="width:40px; height:40px; flex:none; border-radius:50%; background:center/cover url(${v.firstPhoto}); border:2px solid #fff; box-shadow:0 0 0 1px rgba(23,23,26,.1)"></div>`}
        </div>

        <div style="margin-top:18px; display:flex; align-items:flex-end; justify-content:space-between">
          <div>
            <div style="font-size:14px; color:#6B6A66">${v.t.total}</div>
            <div style="font-size:13px; color:#6B6A66; margin-top:2px">${v.t.oneTime}</div>
          </div>
          <div style="font-size:28px; font-weight:700; letter-spacing:-.03em">${v.o ? fmt(v.o.amount_kzt) : v.priceStr}</div>
        </div>

        <label style="display:block; margin-top:16px">
          <div style="font-size:13px; color:#6B6A66; margin-bottom:6px">${v.t.emailLabel} <span style="color:#9A9993">· ${v.t.optional}</span></div>
          <input type="email" value=${v.email} onInput=${v.onEmail} placeholder="name@mail.kz" style="width:100%; height:50px; padding:0 14px; border-radius:14px; border:1px solid rgba(23,23,26,.12); background:#fff; font-size:16px; outline:none" />
        </label>

        ${v.payFailed && html`<div style="margin-top:12px; padding:12px 14px; border-radius:14px; background:#FBEDE7; color:#8A2E12; font-size:14px; line-height:1.4; animation:fadeUp .25s ease both">${v.t.payFail}</div>`}

        ${v.payWait ? html`
          <div style="margin-top:16px; width:100%; height:58px; border-radius:18px; background:#ECE9E2; font-size:17px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px">
            ${spinner('rgba(23,23,26,.2)', '#17171A')}<span>${v.t.waitPay}</span>
          </div>
          <a href=${v.payUrl} target="_blank" rel="noopener" style="display:block; margin-top:10px; text-align:center; font-size:14px; font-weight:600; color:#17171A">${v.t.reopen}</a>` : html`
        <button onClick=${v.pay} class="press" style="margin-top:16px; width:100%; height:58px; border:0; border-radius:18px; cursor:pointer; background:#17171A; color:#fff; font-size:17px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px">
          ${v.payBusy && spinner('rgba(255,255,255,.3)', '#fff')}
          <span style="width:18px; height:18px; border-radius:6px; background:#E3262B"></span>
          <span>${v.payLabel}</span>
        </button>`}
        <div style="margin-top:10px; text-align:center; font-size:12px; color:#6B6A66; display:flex; align-items:center; justify-content:center; gap:6px">${ICON.lock}${v.t.afterPay}</div>
      </div>
    </div>`;
  }

  render() {
    const v = this.vals();
    return html`<div style="min-height:100vh; font-family:'Golos Text', system-ui, sans-serif; background:#F5F3EE; color:#17171A; display:flex; flex-direction:column">
      <input type="file" accept="image/*,.heic,.heif" ref=${this.fileRef} onChange=${e => this.onFile(e)} style="display:none" />

      <header style="position:sticky; top:0; z-index:20; background:rgba(245,243,238,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid rgba(23,23,26,.06)">
        <div style="max-width:1200px; margin:0 auto; height:60px; padding:0 16px; display:flex; align-items:center; justify-content:space-between">
          <button onClick=${v.goHome} style="all:unset; cursor:pointer; display:flex; align-items:center; gap:6px; font-family:'Unbounded', sans-serif; font-weight:700; font-size:19px; letter-spacing:-.02em">qaitala<span style="width:7px; height:7px; border-radius:50%; background:#D2FF3A; box-shadow:0 0 0 1.5px #17171A; margin-top:6px"></span><span style="font-weight:600; color:#6B6A66">kz</span></button>
          <div style="display:flex; gap:2px; padding:3px; border-radius:999px; background:#ECE9E2">
            ${[['ru','RU'],['kz','ҚАЗ']].map(([id, label]) => html`
              <button key=${id} onClick=${() => v.setLang(id)} style="border:0; cursor:pointer; height:30px; padding:0 12px; border-radius:999px; font-size:13px; font-weight:600; background:${v.lang === id ? '#17171A' : 'transparent'}; color:${v.lang === id ? '#fff' : '#5F5E59'}; transition:background .2s">${label}</button>`)}
          </div>
        </div>
      </header>

      <main style="flex:1; width:100%">
        ${v.isHome && this.home(v)}
        ${v.isDetail && this.detail(v)}
        ${v.isGen && this.gen(v)}
        ${v.isResult && this.result(v)}
        ${v.isFail && this.fail(v)}
      </main>

      ${v.sheetOpen && this.sheet(v)}
    </div>`;
  }
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
